<style>
:root{--choc:#3a2a22;--cream:#fffaf1;--paper:#f7efe1;--berry:#e8365d;--honey:#ffc83d;--ink:#3a2a22;--mute:#8a7766;--line:#e8dcc6;--ok:#2f7d3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif;padding-bottom:90px}
h1,h2,h3{font-family:'Lobster Two',cursive;font-style:italic;font-weight:700;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px}
header img{width:44px;height:44px;border-radius:50%}
header b{font:italic 700 22px 'Lobster Two';flex:1;color:var(--berry)}
.bag{background:var(--honey);color:#241b33;border:0;border-radius:99px;padding:8px 14px;font-weight:800}
.hero{background:var(--paper);color:var(--ink);text-align:center;padding:26px 16px 70px;position:relative}
.hero img{width:min(300px,72vw);border-radius:50%;box-shadow:0 10px 30px #0006}
.hero p{margin:14px auto 0;max-width:34ch;font-size:18px}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:28px;background:radial-gradient(circle at 14px 0,transparent 13px,var(--paper) 14px) 0 0/28px 28px repeat-x}
.info{max-width:720px;margin:-34px auto 0;position:relative;z-index:2;background:var(--cream);border:2px dashed var(--honey);border-radius:20px;padding:14px 18px;display:flex;justify-content:space-around;gap:10px;text-align:center;font-size:14px}
.info b{display:block;font-size:16px;color:var(--berry)}
main{max-width:720px;margin:0 auto;padding:0 16px}
.tabs{position:sticky;top:60px;z-index:12;background:var(--paper);display:flex;gap:8px;max-width:720px;margin:0 auto;padding:16px 16px 6px}
.tab{flex:1;border:2px solid var(--berry);background:transparent;color:var(--berry);border-radius:99px;padding:10px 12px;font-weight:800}
.tab[aria-pressed=true]{background:var(--berry);color:#fff}
.ord{background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-top:12px;box-shadow:0 4px 14px #00000012}
.lb{display:block;font-weight:800;font-size:15px;color:var(--ink)}
.ord>.lb{margin-bottom:6px}
.fld{display:block;margin-top:12px}.fld:first-child{margin-top:0}
.cl{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.cl img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.clt{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.clt small{color:var(--mute)}.clp{white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:center;padding-top:12px;font-size:18px}
.tot b{color:var(--berry);font-size:20px}
input.txt:focus{border-color:var(--berry);outline:none;box-shadow:0 0 0 3px #e8365d22}
#v-order .cta{padding:16px 22px;font-size:17px;box-shadow:0 6px 16px #e8365d44}
#v-order #cp{box-shadow:none}
.back{display:block;width:100%;margin-top:18px;background:var(--honey);color:#241b33;border:0;border-radius:99px;padding:14px 22px;font-weight:800;font-size:16px;box-shadow:0 4px 12px #00000022}
.row .back{margin-top:0}
.hide{display:none!important}
.frete{background:var(--cream);border:2px dashed var(--honey);border-radius:14px;padding:10px 14px;margin-top:14px;font-size:14px}
select.txt{appearance:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 8px;position:sticky;top:60px;background:var(--paper);z-index:10}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:8px 16px;white-space:nowrap;font-weight:600}
.chip[aria-pressed=true]{background:var(--berry);border-color:var(--berry);color:#fff}
h2{font-size:30px;color:var(--berry);margin:22px 0 6px}
.item{box-shadow:0 4px 14px #00000012;display:flex;gap:14px;align-items:stretch;width:100%;text-align:left;background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:12px;margin:12px 0;color:inherit}
.item .t{flex:1;display:flex;flex-direction:column;gap:4px}
.item h3{font-size:24px;color:var(--ink)}

.item p{margin:0;font-size:14px;color:var(--mute)}
.price{margin-top:auto;font-weight:800;font-size:17px}
.pedir{align-self:flex-start;background:var(--berry);color:#fff;border-radius:99px;padding:6px 18px;font-weight:800;margin-top:6px}
.price small{font-weight:400;color:var(--mute)}
.item img{width:128px;height:128px;object-fit:cover;border-radius:14px;align-self:center}
.tag{align-self:flex-start;font-size:12px;font-weight:800;background:var(--honey);color:#241b33;border-radius:99px;padding:1px 10px}
footer{text-align:center;color:var(--mute);padding:34px 16px;font-size:14px}
footer b{font:italic 700 24px 'Lobster Two';color:var(--berry);display:block}
.sheet{position:fixed;inset:0;z-index:50;background:#0008;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.pane{background:var(--paper);width:min(560px,100%);max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.pane{animation:none}html{scroll-behavior:auto}}
.pane>img{width:100%;height:230px;object-fit:cover;border-radius:24px 24px 0 0}
.pad{padding:14px 18px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--berry);background:var(--cream)}
.opt input{accent-color:var(--berry)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.qty{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:99px;padding:2px}
.qty button{width:36px;height:36px;border-radius:50%;border:0;background:var(--cream);color:var(--berry);font-size:20px;font-weight:800}
.cta{background:var(--berry);color:#fff;border:0;border-radius:99px;padding:14px 22px;font-weight:800;flex:1}
.close{float:right;background:var(--cream);border:0;border-radius:50%;width:36px;height:36px;font-size:18px;color:var(--ink)}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line small{color:var(--mute);display:block}
.rm{background:none;border:0;color:var(--berry);font-weight:700;padding:0}
input.txt,textarea{width:100%;border:1.5px solid var(--line);background:var(--cream);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;margin-top:6px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;max-width:696px;margin:auto;display:none;justify-content:space-between;align-items:center;background:var(--berry);color:#fff;border:0;border-radius:99px;padding:14px 22px;font-weight:800;box-shadow:0 8px 24px #0005}
.bar.on{display:flex}
</style>

const $=s=>document.querySelector(s),brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let cart=[],filter="todos";
function render(){
 $("#list").innerHTML=CAKES.filter(c=>filter==="todos"||c.c===filter).map(c=>`<button class="item" data-id="${c.id}">
  <div class="t">${c.tag?`<span class="tag">${c.tag}</span>`:""}<h3>${c.n}</h3><p>${c.d}</p><div class="price">Médio ${brl(c.p.medio)} · Grande ${brl(c.p.grande)}</div><span class="pedir">Pedir</span></div>
  <img src="${c.img}" alt="${c.n}" loading="lazy"></button>`).join("");
}
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
$("#list").onclick=e=>{const b=e.target.closest(".item");if(b)openCake(b.dataset.id)};
function openCake(id){
 const c=CAKES.find(x=>x.id===id);let q=1;
 $("#spp").innerHTML=`<img src="${c.img}" alt="${c.n}"><div class="pad"><button class="close" aria-label="Fechar">✕</button><h2 style="margin-top:0">${c.n}</h2><p style="color:var(--mute);margin:4px 0 10px">${c.d}</p>
 ${SIZES.map((s,i)=>`<label class="opt"><span><b>${s.n}</b><br><small>${s.d}</small></span><span><b>${brl(c.p[s.id])}</b> <input type="radio" name="sz" value="${s.id}" ${i==0?"checked":""}></span></label>`).join("")}
 <p style="margin:14px 0 4px"><b>Calda</b></p><label class="opt"><span><b>Com calda</b></span><input type="radio" name="cal" value="com" checked></label><label class="opt"><span><b>Sem calda</b></span><input type="radio" name="cal" value="sem"></label>
 <div class="row"><div class="qty"><button id="mi" aria-label="Menos">−</button><b id="q">1</b><button id="pl" aria-label="Mais">+</button></div><button class="cta" id="add"></button></div></div>`;
 const sel=()=>document.querySelector('input[name=sz]:checked').value;
 const upd=()=>{$("#q").textContent=q;$("#add").textContent="Adicionar · "+brl(c.p[sel()]*q)};
 upd();$("#spp").onchange=upd;$("#mi").onclick=()=>{q=Math.max(1,q-1);upd()};$("#pl").onclick=()=>{q++;upd()};
 $("#add").onclick=()=>{const s=sel(),cl=document.querySelector('input[name=cal]:checked').value,k=cart.find(x=>x.id===id&&x.s===s&&x.cal===cl);k?k.q+=q:cart.push({id,s,q,cal:cl});$("#sp").classList.remove("on");sync();show("order")};
 $("#spp .close").onclick=()=>$("#sp").classList.remove("on");$("#sp").classList.add("on");
}
const total=()=>cart.reduce((t,i)=>t+CAKES.find(c=>c.id===i.id).p[i.s]*i.q,0),count=()=>cart.reduce((t,i)=>t+i.q,0);
function sync(){const n=count();$("#hcount").textContent=n;$("#bar").classList.toggle("on",n>0);$("#barn").textContent=n+(n==1?" item":" itens");$("#bart").textContent=brl(total())}
function show(t){
 const o=t==="order";
 $("#v-menu").classList.toggle("hide",o);$("#v-order").classList.toggle("hide",!o);
 if(o)renderOrder();window.scrollTo({top:0});
}
function openCart(){show("order")}
const form={nm:"",ad:"",hr:"",ob:""};const esc=t=>t.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
function renderOrder(){
 const v=$("#v-order");
 const lines=cart.length?cart.map((i,x)=>{const c=CAKES.find(k=>k.id===i.id),s=SIZES.find(z=>z.id===i.s);return `<div class="cl"><img src="${c.img}" alt=""><div class="clt"><b>${i.q>1?i.q+"× ":""}${c.n}</b><small>${s.n} · ${i.cal==="sem"?"sem calda":"com calda"}</small><button class="rm" data-x="${x}">Remover</button></div><b class="clp">${brl(c.p[i.s]*i.q)}</b></div>`}).join("")+`<div class="tot"><span>Total dos bolos</span><b>${brl(total())}</b></div>`:`<p style="color:var(--mute);margin:6px 0">Nenhum bolo escolhido ainda. Volte e toque em <b>Pedir</b>.</p>`;
 v.innerHTML=`<button class="back" id="back">← Voltar aos bolos</button><h2 style="margin-top:8px">Seu pedido 🎂</h2>
 <div class="ord"><div class="lb">🍰 Bolo</div>${lines}</div>
 <div class="ord">
  <label class="fld"><span class="lb">👤 Nome</span><input class="txt" id="nm" autocomplete="name" placeholder="Seu nome" value="${esc(form.nm)}"></label>
  <label class="fld"><span class="lb">📍 Endereço</span><input class="txt" id="ad" autocomplete="street-address" placeholder="Rua, número, bairro" value="${esc(form.ad)}"></label>
  <label class="fld"><span class="lb">⏰ Estimativa do horário da entrega</span><input class="txt" id="hr" placeholder="Ex.: hoje às 15h, amanhã de manhã…" value="${esc(form.hr)}"></label>
 </div>
 <div class="frete">🚚 <b>Frete:</b> o valor depende do local. Ele é combinado com você na conversa do WhatsApp.</div>
 <div class="row"><a class="cta" id="send" target="_blank" rel="noopener" href="#" style="text-align:center;text-decoration:none;display:block">Enviar pedido no WhatsApp</a></div>
 <div class="row"><button class="cta" id="cp" style="background:var(--cream);color:var(--berry);border:1.5px solid var(--berry)">Copiar pedido</button></div>
 <div class="row"><button class="back" id="back2">🍰 Escolher outro bolo</button></div>
 <p style="font-size:13px;color:var(--mute);margin:8px 0 0">Se o WhatsApp não abrir, copie o pedido e envie para +55 86 99470-0126.</p>`;
 $("#back").onclick=()=>show("menu");$("#back2").onclick=()=>show("menu");
 document.querySelectorAll(".rm[data-x]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.x,1);sync();renderOrder()});
 const build=()=>{
  const L=cart.length?cart.map(i=>{const c=CAKES.find(k=>k.id===i.id);return `• ${i.q}x ${c.n} (${SIZES.find(z=>z.id===i.s).n}, ${i.cal==="sem"?"sem calda":"com calda"}) - ${brl(c.p[i.s]*i.q)}`}).join("\n"):"• (nenhum bolo escolhido)";
  return `Olá! Quero fazer um pedido nos Bolos Caseiros PHB:\n\n${L}\n\nTotal: ${brl(total())}\nNome: ${form.nm}\nEndereço/retirada: ${form.ad}\nHorario/entrega: ${form.hr}`};
 const s=$("#send"),upd=()=>{s.href="https://api.whatsapp.com/send?phone="+WHATS+"&text="+encodeURIComponent(build())};
 [["nm"],["ad"],["hr"]].forEach(([k])=>$("#"+k).addEventListener("input",e=>{form[k]=e.target.value;upd()}));
 upd();s.onclick=upd;
 $("#cp").onclick=()=>{const t=document.createElement("textarea");t.value=build();document.body.appendChild(t);t.select();try{document.execCommand("copy");$("#cp").textContent="Pedido copiado!"}catch(e){}t.remove()};
}
$("#bar").onclick=openCart;$("#hbag").onclick=openCart;
document.querySelectorAll(".sheet").forEach(s=>s.addEventListener("click",e=>{if(e.target===s)s.classList.remove("on")}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("on"))});
render();
</script>
</body>
</html>
